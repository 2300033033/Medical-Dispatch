[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-dispatch-env"
version = "1.0.0"
description = "Real-world 911 emergency medical dispatch environment"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]

[tool.openenv]
environment-path = "environment.py"
environment-class = "MedicalDispatchEnv"